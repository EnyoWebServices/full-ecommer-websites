  <meta charset="UTF-8">

  <title>Contact Us</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 17px 32px;
      background: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.25);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .whatsapp-btn:hover {
      background: #1ebe5d;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.35);
    }

    .whatsapp-btn svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      .whatsapp-btn {
        padding: 15px 25px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
